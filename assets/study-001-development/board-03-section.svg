2725">HOT-SUNNY RESPONSE</text><rect x="1090" y="535" width="450" height="94" rx="0" fill="#ffffff" stroke="#b9b2aa" stroke-width="1" stroke-dasharray="" opacity="1"/><text x="1112" y="565" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0" fill="#292725">1</text><text x="1148" y="563" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" fill="#292725">Oversized roof shades the east glass</text><text x="1112" y="595" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0" fill="#292725">2</text><text x="1148" y="593" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" fill="#292725">Deep south terrace protects family openings</text><text x="1112" y="625" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="0" fill="#292725">3</text><text x="1148" y="623" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" fill="#292725">Solid west wall limits afternoon heat</text><text x="1090" y="682" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="1.3" fill="#292725">MATERIAL PALETTE</text><rect x="1090" y="706" width="100" height="78" rx="0" fill="#eeeae4" stroke="#292725" stroke-width="1" stroke-dasharray="" opacity="1"/><rect x="1205" y="706" width="100" height="78" rx="0" fill="#292725" stroke="#292725" stroke-width="1" stroke-dasharray="" opacity="1"/><rect x="1320" y="706" width="100" height="78" rx="0" fill="#cdd8da" stroke="#292725" stroke-width="1" stroke-dasharray="" opacity="1"/><rect x="1435" y="706" width="100" height="78" rx="0" fill="#c6aa85" stroke="#292725" stroke-width="1" stroke-dasharray="" opacity="1"/><text x="1140" y="805" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0" fill="#292725">CONCRETE</text><text x="1255" y="805" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0" fill="#292725">STEEL</text><text x="1370" y="805" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0" fill="#292725">GLASS</text><text x="1485" y="805" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="0" fill="#292725">TIMBER</text><text x="1090" y="866" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="1.3" fill="#292725">STRUCTURAL NOTE</text><text x="1090" y="896" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" fill="#77716b">Frame depth, hanger spacing and canopy cantilever are conceptual.</text><text x="1090" y="918" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" fill="#77716b">Architect and structural engineer to resolve local loads, movement,</text><text x="1090" y="940" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" fill="#77716b">waterproofing, thermal bridging and glass performance.</text><text x="58" y="995" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" text-anchor="start" letter-spacing="1.3" fill="#292725">SECTIONAL EXPERIENCE</text><text x="58" y="1026" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" font-style="normal" text-anchor="start" letter-spacing="0" fill="#292725">Dramatic structure outside. Calm, practical rooms inside.</text><line x1="58" y1="1074" x2="1542" y2="1074" stroke="#b9b2aa" stroke-width="1" stroke-dasharray="" opacity="1"/><text x="58" y="1104" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" fill="#77716b">A single structural idea coordinates roof, upper floor, stair, shade and movement.</text><text x="800" y="1104" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" font-style="normal" text-anchor="middle" letter-spacing="1.2" fill="#292725">CONCEPT DESIGN - NOT FOR CONSTRUCTION</text><text x="1542" y="1104" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" font-style="normal" text-anchor="end" letter-spacing="0" fill="#292725">A1 / 3 OF 3</text>
</svg>